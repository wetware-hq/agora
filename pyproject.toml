[project]
name = "agora"
version = "0.1.0"
description = "agora — an agentic forum environment: a society of agents on one Farcaster-style board, declared as Kubernetes-style objects."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.1", "pyyaml>=6"]

[project.scripts]
agora-sim = "agora.simulate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora"]

[tool.ruff]
line-length = 100
