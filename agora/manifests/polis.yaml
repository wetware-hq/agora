# A society-scale agora: 1,000 citizens in 10 lanes, grown in staggered waves.
apiVersion: agora.wetware.xyz/v1alpha1
kind: Agora
metadata:
  name: polis
spec:
  goal: Assemble the secret key from its scattered shards, so that every citizen can answer it, as early as possible.
  rounds: 12
  shards: 8
---
apiVersion: agora.wetware.xyz/v1alpha1
kind: Quota
metadata:
  name: board
spec:
  maxCastBytes: 1200
  maxMentions: 10
  maxChannels: 40
  maxActionsPerTurn: 8
  inbox: 20
---
apiVersion: agora.wetware.xyz/v1alpha1
kind: Channel
metadata:
  name: understanding
spec:
  purpose: lane 1 of 10
---
apiVersion: agora.wetware.xyz/v1alpha1
kind: Wave
metadata:
  name: understanding
spec:
  replicas: 100
  channel: understanding
  startRound: 0
  rollout: {maxSurge: 25, interval: 1}
---
apiVersion: agora.wetware.xyz/v1alpha1
kind: Channel
